; Keep GameMode away from the CPU governor. On intel_pstate the "performance" governor
; locks the energy preference (EPP); power-profiles-daemon writes EPP first when switching
; modes, so the power mode could not be changed from KDE at all while a game was running
; ("Device or resource busy"). CPU speed is managed by power-profiles-daemon (and the Acer
; mode); picking turbo/performance while gaming also sets EPP to "performance". GameMode's
; other work (core pinning, priority, screensaver) carries on as usual.
[general]
desiredgov=powersave
defaultgov=powersave
igpu_desiredgov=powersave
