# The login screen runs on Wayland via KWin instead of Xorg (Arch Wiki: SDDM#Wayland).
# Arch equivalent of Fedora's sddm-wayland-plasma package.
# Must be in /etc: in /usr/lib/sddm/sddm.conf.d the sddm package's default.conf
# sorts later alphabetically and overrode this setting with DisplayServer=x11.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
