# keyd grabs every keyboard but changes no keys (empty [main]). Without this file
# keyd never touches the keyboard and per-window mappings don't work.
# Per-window mappings live in the user's ~/.config/keyd/app.conf; they are applied by
# keyd-application-mapper (/etc/xdg/autostart/nos-keyd-application-mapper.desktop).
[ids]
*

[main]

# Empty layer: lets a single key temporarily turn off the app.conf mappings. In app.conf
# write e.g. "slash = toggle(nomap)" (the "." key on Turkish Q) and "nomap.e = e" for every mapped key; while the
# layer is on, keys type normally (see README, Key remapping). keyd only accepts a new
# layer if it is defined in this file.
[nomap]
