# nos: shrink the initrd. bootc + systemd-boot put the kernel and initrd on the EFI partition;
# in the target install that partition is shared with Windows and is 512 MB. bootcrew's setting
# (hostonly=no) puts every driver and its firmware into the initrd (~141 MB).
# GPU drivers not needed early in boot are left out; they still load later
# while the system boots:
# - nvidia*: NVIDIA (nvidia-open), its GSP firmware is tens of MB. Intel draws the desktop.
#   It was put back for a while (blamed for flickering with night light); the cause turned
#   out to be a KWin color setting, unrelated to NVIDIA.
# - nouveau: blacklisted, never used; its firmware is large.
# - amdgpu, radeon: not in the owner's hardware.
# Intel (i915, xe) stays: it shows the boot screen.
omit_drivers+=" nvidia nvidia_drm nvidia_modeset nvidia_uvm nvidia_peermem nouveau amdgpu radeon "
