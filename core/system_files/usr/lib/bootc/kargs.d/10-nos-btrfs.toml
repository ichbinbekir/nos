# nos: zstd compression on btrfs (level 1: fast, no real CPU load; Fedora's default).
# bootc adds this to the kernel command line on install and on update; the
# rootflags=subvol=/ written by the installer stays, systemd merges both (subvol=/,compress=zstd:1).
# Only newly written files are compressed.
# The root file system must be btrfs: any other file system rejects this option and won't boot.
kargs = ["rootflags=compress=zstd:1"]
