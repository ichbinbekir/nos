# zapret's config and lists are in /etc/zapret instead of /opt/zapret: /opt is read-only in the image.
# ZAPRET_RW: config, ipset/ (IP lists) and init.d/sysv/custom.d.
# HOSTLIST_BASE: site lists (<HOSTLIST>); if unset, /opt/zapret/ipset is used, nfqws
# couldn't write its auto list there and exited immediately (zapret never worked).
[Service]
Environment=ZAPRET_RW=/etc/zapret
Environment=HOSTLIST_BASE=/etc/zapret/ipset
