# systemd-oomd: for programs in the user session (each app in its own cgroup), if memory
# pressure stays above 50% for 20 s, the app causing the most pressure is killed;
# the computer doesn't freeze. Fedora's default (systemd-oomd-defaults package).
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
