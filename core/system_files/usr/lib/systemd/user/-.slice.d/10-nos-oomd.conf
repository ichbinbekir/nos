# WORKAROUND (systemd#43174): when the user session's systemd reloads its config
# (happens at login), it reports its own root slice to oomd as "auto"; this deletes the
# "kill" entry the system set for user@<uid>.service and the session was no longer monitored
# ("Memory Pressure Monitored CGroups" empty in oomctl). With the same rule here as well,
# both reports match. Values must stay the same as in system/user@.service.d/10-nos-oomd.conf.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
