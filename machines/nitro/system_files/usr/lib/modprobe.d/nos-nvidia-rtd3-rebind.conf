# GEÇİCİ ÇÖZÜM (NVIDIA open-gpu-kernel-modules#1507, NVIDIA iç kaydı 7039712): Linux 7.3'te
# sürücü kartı açılışta bir çekirdek iş parçacığından tanıtıyor ve oradan
# /sys/bus/pci/devices/<kart>/config'i açamıyor; uyku özelliğini (RTD3) sessizce "Not
# supported" sayıyor ve kart hiç uyumuyor. Sürücü yüklendikten hemen sonra kart bir kez
# bırakılıp yeniden tanıtılınca (normal süreçten) özellik açılıyor. Düzeltilmiş sürücü
# gelince bu dosya ve /usr/libexec/nos-nvidia-rtd3-rebind silinir.
install nvidia /usr/bin/modprobe --ignore-install nvidia $CMDLINE_OPTS && /usr/bin/bash /usr/libexec/nos-nvidia-rtd3-rebind
