# Acer Nitro 16 (AN16-51): gaming features of the kernel's acer_wmi driver (power modes,
# fan speed and temperature sensors, turbo/NitroSense key). The model is not in the kernel's
# list, so they are enabled by hand; the commands match the AN16-51's ACPI tables (SSDT10, WMBH).
# No effect on non-Acer computers, since acer_wmi never loads there.
options acer_wmi predator_v4=1
