# NVIDIA kartı boştayken tamamen uyusun (RTD3, ince taneli: 0x02). Varsayılan 0x03 ("sistem
# destekliyorsa") bu dizüstünde kapalı kalıyordu (/proc/driver/nvidia/gpus/*/power: "Runtime
# D3 status: Disabled by default"); masaüstü Intel'de çalışırken kart pilde hiç uyumuyordu.
# Bkz. NVIDIA sürücü belgesi, "PCI-Express Runtime D3 (RTD3) Power Management".
options nvidia NVreg_DynamicPowerManagement=0x02
