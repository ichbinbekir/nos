# nos: initrd'yi küçült. bootc + systemd-boot kernel ve initrd'yi EFI bölümüne koyuyor;
# hedef kurulumda o bölüm Windows'la ortak ve 512 MB. bootcrew'un ayarı (hostonly=no)
# bütün sürücüleri ve firmware'lerini initrd'ye koyuyor.
# Çıkarılanlar (sahibinin donanımında kullanılmıyor):
# - nouveau: Kara listede (nvidia-open kullanılıyor); firmware'i büyük.
# - amdgpu, radeon: AMD ekran kartları.
# NVIDIA (nvidia-open) bilerek initrd'de kalıyor: çıkarıldığında (erken yüklenmeyince)
# gerçek bilgisayarda bazı uygulamalarda grafik hataları görüldü.
# Intel (i915, xe) de kalıyor.
omit_drivers+=" nouveau amdgpu radeon "
