# nos: initrd'yi küçült. bootc + systemd-boot kernel ve initrd'yi EFI bölümüne koyuyor;
# hedef kurulumda o bölüm Windows'la ortak ve 512 MB. bootcrew'un ayarı (hostonly=no)
# bütün sürücüleri ve firmware'lerini initrd'ye koyuyor (~141 MB).
# Açılışın başında gerekmeyen ekran kartı sürücüleri çıkarılır; sistem açılırken yine
# yüklenirler:
# - nvidia*: NVIDIA (nvidia-open), GSP firmware'i onlarca MB. Masaüstünü Intel çiziyor.
#   Bir ara geri konmuştu (gece ışığında titreme yüzünden sanıldı); sebep KWin'in
#   renk ayarıymış, NVIDIA ile ilgisi yokmuş.
# - nouveau: Kara listede, hiç kullanılmıyor; firmware'i büyük.
# - amdgpu, radeon: Sahibinin donanımında yok.
# Intel (i915, xe) kalıyor: açılış ekranını o gösteriyor.
omit_drivers+=" nvidia nvidia_drm nvidia_modeset nvidia_uvm nvidia_peermem nouveau amdgpu radeon "
