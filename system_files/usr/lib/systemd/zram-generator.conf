# Sıkıştırılmış RAM takas alanı (zram). Sistemde takas bölümü yok; bellek dolunca
# donmak ya da uygulamaların kapanması yerine az kullanılan veri RAM'de sıkıştırılır.
# Fedora'nın varsayılanı: RAM kadar, en fazla 8 GB (16 GB RAM'de 8 GB).
[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
