# GEÇİCİ ÇÖZÜM (systemd#43174): kullanıcı oturumundaki systemd ayarlarını yeniden yükleyince
# (oturum açılışında oluyor) kendi kök dilimini "auto" diye oomd'ye bildiriyor; bu, sistemin
# user@<uid>.service için verdiği "kill" kaydını siliyor ve oturum bir daha izlenmiyordu
# (oomctl'de "Memory Pressure Monitored CGroups" boş). Aynı kural buraya da yazılınca iki
# bildirim aynı oluyor. Değerler system/user@.service.d/10-nos-oomd.conf ile aynı kalmalı.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
