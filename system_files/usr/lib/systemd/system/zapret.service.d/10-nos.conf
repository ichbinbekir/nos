# zapret ayarları ve listeleri /opt/zapret yerine /etc/zapret'te: imajda /opt salt okunur.
# ZAPRET_RW: config, ipset/ (IP listeleri) ve init.d/sysv/custom.d.
# HOSTLIST_BASE: site listeleri (<HOSTLIST>); verilmezse /opt/zapret/ipset kullanılıyor,
# nfqws otomatik listeyi oraya yazamayıp hemen kapanıyordu (zapret hiç çalışmıyordu).
[Service]
Environment=ZAPRET_RW=/etc/zapret
Environment=HOSTLIST_BASE=/etc/zapret/ipset
