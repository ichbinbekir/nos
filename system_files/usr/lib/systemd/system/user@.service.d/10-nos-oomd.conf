# systemd-oomd: kullanıcı oturumundaki programlar (her uygulama kendi grubunda) bellek
# baskısı 20 sn boyunca %50'nin üstünde kalırsa, en çok baskı yapan uygulama kapatılır;
# bilgisayar donup kalmaz. Fedora'nın varsayılanı (systemd-oomd-defaults paketi).
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
