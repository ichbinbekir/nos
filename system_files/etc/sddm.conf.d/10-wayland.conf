# Giriş ekranı Xorg yerine KWin üzerinde Wayland ile çalışır (Arch Wiki: SDDM#Wayland).
# Fedora'daki sddm-wayland-plasma paketinin Arch'taki karşılığı.
# /etc'de olmalı: /usr/lib/sddm/sddm.conf.d'de sddm paketinin default.conf'u
# alfabede sonra geldiği için DisplayServer=x11 ile bu ayarı eziyordu.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
