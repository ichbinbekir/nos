# keyd bütün klavyeleri yakalar ama hiçbir tuşu değiştirmez (boş [main]). Bu dosya
# olmadan keyd klavyeye hiç dokunmaz ve pencereye göre eşlemeler çalışmaz.
# Pencereye göre eşlemeler kullanıcının ~/.config/keyd/app.conf dosyasında; onları
# keyd-application-mapper uygular (/etc/xdg/autostart/nos-keyd-application-mapper.desktop).
[ids]
*

[main]

# Boş katman: app.conf'taki eşlemeleri bir tuşla geçici kapatmak için. app.conf'ta
# örneğin "dot = toggle(nomap)" ve eşlenen her tuş için "nomap.e = e" yazılır; katman
# açıkken tuşlar normal yazar (bkz. README, Tuş eşleme). keyd yeni katmanı sadece bu
# dosyada tanımlıysa kabul ediyor.
[nomap]
