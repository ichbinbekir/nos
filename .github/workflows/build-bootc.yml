name: Build bootc

# Builds the nos-bootc image (only the compiled bootc). The main build (build.yml) copies bootc
# from this image instead of compiling it every day.
#
# When it builds:
# - Every day at 03:00 UTC (an hour before the main build) it checks for a new bootc release;
#   if there is one it builds, otherwise it finishes in a few seconds.
# - On Mondays it rebuilds even if the version is the same: as Arch libraries change, bootc
#   is at most a week old.
# - Always when the bootc build files change and when triggered manually.
# It doesn't trigger the main build; the two workflows are independent. The new bootc is
# picked up on the main build's next run (04:00 or manual).

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/bootc/build-bootc.sh'
      - 'scripts/bootc/Containerfile'
      - '.github/workflows/build-bootc.yml'
  # The project is deprecated (Nov 23, 2026): the daily scheduled check was turned off.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # The registry doesn't accept uppercase, so the user name is lowercased
      - name: Find latest bootc version
        run: |
          set -euo pipefail
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nos-bootc" >> "$GITHUB_ENV"
          VERSION=$(git ls-remote --tags --refs https://github.com/bootc-dev/bootc.git 'v*' |
            awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Latest bootc version: $VERSION"

      - name: Log in to registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Decide whether to build
        id: decide
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$(date -u +%u)" != 1 ]] &&
            podman pull --quiet "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "bootc $VERSION is already built and today is not the weekly rebuild day; skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bootc
        if: steps.decide.outputs.build == 'true'
        run: just build-bootc "$VERSION"

      - name: Push image
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euxo pipefail
          for tag in "$VERSION" latest; do
            podman push nos-bootc:latest "$IMAGE:$tag"
          done

      # Delete untagged versions: the weekly rebuild moves the same tags (version, latest) to
      # the new image, leaving the previous one untagged. The nos build only uses latest; no
      # untagged version is needed. If deletion fails, the build is not marked as failed.
      - name: Delete untagged images
        if: steps.decide.outputs.build == 'true'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: nos-bootc
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0
