name: Build disk image

# Yayınlanmış imajdan sanal makinede denemek için disk imajı üretir.
# Gerçek bilgisayara kurulum için bkz. README.md "Kurulum".
on:
  workflow_dispatch:
    inputs:
      format:
        description: "Disk biçimi: vdi (VirtualBox) ya da qcow2 (QEMU/virt-manager)"
        type: choice
        options:
          - vdi
          - qcow2
        default: vdi

permissions:
  contents: read
  packages: read

jobs:
  disk:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      FORMAT: ${{ inputs.format }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Pull image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nos:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "$REGISTRY_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$IMAGE"

      - name: Build disk image
        run: |
          sudo "$(which just)" disk-image "$IMAGE"
          sudo "$(which just)" convert "$FORMAT"
          sudo rm -f output/disk.raw

      # qcow2 zaten sıkıştırılmış; vdi sıkıştırılmadığı için indirme boyutu zip ile küçültülür.
      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: nos-${{ inputs.format }}
          path: output/disk.${{ inputs.format }}
          retention-days: 7
          compression-level: ${{ inputs.format == 'vdi' && 6 || 0 }}
