name: Build installer ISO

# Builds the installer ISO (iso/, archiso) and puts it in the run's Artifacts (7 days).
# Once installation has been tested in a VM and on real hardware, it will go to Releases.
# Triggered manually:
# The ISO contains no image; the latest image is downloaded during installation, so the ISO
# only needs rebuilding when the installer or the live environment changes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mkarchiso uses loop devices and mounts, so it needs root and --privileged.
      - name: Build ISO
        run: |
          set -euxo pipefail
          sudo podman run --rm --privileged -v "$PWD:/w" docker.io/archlinux/archlinux:latest \
            bash -c 'pacman -Syu --noconfirm archiso && mkarchiso -v -w /tmp/work -o /w/out /w/iso'
          sudo chown -R "$(id -u):$(id -g)" out
          cd out && sha256sum ./*.iso > SHA256SUMS && ls -lh

      # The ISO is already compressed; don't compress it again in the zip.
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: nos-installer
          path: out/
          retention-days: 7
          compression-level: 0
