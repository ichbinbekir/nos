name: Build installer ISO

# Kurulum ISO'sunu (iso/, archiso) build edip çalışmanın Artifacts bölümüne koyar (7 gün).
# Kurulum sanal makinede ve gerçek bilgisayarda denenince Releases'e konmaya başlanacak.
# Elle tetiklenir:
# ISO'nun içinde imaj yok, kurulum sırasında en son imaj internetten indiriliyor; bu yüzden
# ISO sadece kurulum programı ya da canlı ortam değişince yeniden üretilmeli.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mkarchiso loop aygıtı ve bağlama (mount) kullandığı için root ve --privileged gerekiyor.
      - name: Build ISO
        run: |
          set -euxo pipefail
          sudo podman run --rm --privileged -v "$PWD:/w" docker.io/archlinux/archlinux:latest \
            bash -c 'pacman -Syu --noconfirm archiso && mkarchiso -v -w /tmp/work -o /w/out /w/iso'
          sudo chown -R "$(id -u):$(id -g)" out
          cd out && sha256sum ./*.iso > SHA256SUMS && ls -lh

      # ISO zaten sıkıştırılmış; zip'te tekrar sıkıştırılmaz.
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: nos-installer
          path: out/
          retention-days: 7
          compression-level: 0
