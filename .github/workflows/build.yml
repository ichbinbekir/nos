name: Build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Registry büyük harf kabul etmediği için repo adını küçük harfe çeviriyoruz
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # ublue imajları ~128 katmanlı; Docker'ın overlay2 sınırına (125) takıldığı için podman kullanıyoruz
      - name: Build image
        run: |
          podman build --pull=newer --file Dockerfile \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$GITHUB_SHA" \
            .

      - name: Log in to registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        run: |
          podman push "$IMAGE:latest"
          podman push "$IMAGE:$GITHUB_SHA"
