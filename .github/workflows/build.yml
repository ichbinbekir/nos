name: Build

on:
  push:
    branches:
      - master
    paths-ignore:
      # Files that don't change the image contents
      - '**.md'
      - 'docs/**'
      - 'dotfiles/**'
      - '.chezmoiroot'
      - 'tools/**'
      - 'LICENSE'
      - 'cosign.pub'
      - '.gitignore'
      - '.gitattributes'
      # Installer ISO; build-iso.yml builds it manually.
      - 'iso/**'
      - '.github/workflows/build-iso.yml'
      # Files that only concern the bootc image; build-bootc.yml builds them.
      # The two workflows are independent: a new bootc is picked up on the next build (04:00 or manual).
      - 'scripts/bootc/build-bootc.sh'
      - 'scripts/bootc/Containerfile'
      - '.github/workflows/build-bootc.yml'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/**'
      - 'dotfiles/**'
      - '.chezmoiroot'
      - 'iso/**'
  # Arch is a rolling release: packages update daily, so the image is rebuilt daily too.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # First the shared image (nos) is built; it isn't published and only lives inside this job.
  # Then each machine image (nos-<machine>, every folder under machines/) is built on top of it
  # in turn, rechunked, pushed and signed. The shared image is built once: if machines were
  # built in parallel jobs, each would have to rebuild the shared image or download it from
  # somewhere.
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    env:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
    outputs:
      machines: ${{ steps.machines.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # The registry doesn't accept uppercase, so the user name is lowercased
      - name: Set registry
        run: |
          echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "BOOTC_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nos-bootc:latest" >> "$GITHUB_ENV"

      # Every folder under machines/ is a machine image. Adding a folder is enough for a new
      # machine (plus the image name in core/system_files/etc/containers/policy.json).
      - name: List machines
        id: machines
        run: |
          list=$(find machines -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "MACHINES=$(jq -r 'join(" ")' <<<"$list")" >> "$GITHUB_ENV"
          echo "Machines: $list"

      # Log in before the build because the build pulls the nos-bootc image.
      - name: Log in to registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          # cosign uses Docker's credentials
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build base image
        run: just build

      # Images are signed if SIGNING_SECRET is set. If the key is encrypted, its password is in
      # the COSIGN_PASSWORD secret (see README).
      - name: Install cosign
        if: github.event_name != 'pull_request' && env.SIGNING_SECRET != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      # For each machine: build → rechunk → push → sign. If one machine fails, the others are
      # still pushed and the job is marked failed at the end. Pull requests only build (no push).
      #
      # Tags: latest (what systems track) and YYYYMMDD (to go back to an earlier day).
      # When podman first pushes new blobs it sends incomplete layer info, so the first push
      # gets a different digest than later ones (podman#27796; bootcrew does the same). So
      # latest is pushed twice, then the date tag; all carry the same digest and the signature
      # is made for that digest.
      - name: Build, push and sign machine images
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          PUBLISH: ${{ github.event_name != 'pull_request' }}
        run: |
          # The outer shell doesn't stop on errors (if one machine fails, the others continue);
          # each machine stops on error in its own subshell. (set -e doesn't work in a subshell
          # inside an if condition, so the result is checked separately.)
          set +e
          set -uo pipefail
          failed=()
          for machine in $MACHINES; do
            echo "::group::nos-$machine"
            (
              set -euxo pipefail
              image="nos-$machine"
              BASE_IMAGE=localhost/nos:latest just build-machine "$machine"
              if [[ $PUBLISH == true ]]; then
                just rechunk "$image"
                for tag in latest latest "$(date -u +%Y%m%d)"; do
                  podman push --digestfile=/tmp/digestfile "$image:latest" "$IMAGE_REGISTRY/$image:$tag"
                  echo "$tag -> $(< /tmp/digestfile)"
                done
                if [[ -n $SIGNING_SECRET ]]; then
                  cosign sign -y --new-bundle-format=false --use-signing-config=false \
                    --key env://COSIGN_PRIVATE_KEY "$IMAGE_REGISTRY/$image@$(< /tmp/digestfile)"
                fi
              fi
              # Free up space for the next machine.
              podman rmi -f "$image:latest"
            )
            rc=$?
            echo "::endgroup::"
            if ((rc != 0)); then
              echo "::error::nos-$machine failed"
              failed+=("$machine")
            fi
          done
          ((${#failed[@]} == 0)) || { echo "Failed: ${failed[*]}"; exit 1; }

  # Deletes untagged and old versions, separately for each machine image (builds nothing).
  # Even if one machine fails, the others are still cleaned up.
  cleanup:
    needs: build
    if: always() && github.event_name != 'pull_request' && needs.build.outputs.machines != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.build.outputs.machines) }}
    steps:
      # Delete untagged versions: the first push of latest (podman#27796, above) loses its tag
      # on the second push and is left orphaned; every build left one behind. Since signatures
      # use the old format (.sig tag) and the image is a single manifest (not an index), no
      # untagged version is needed. Runs before deleting old images so the 30-version limit
      # only counts images and signatures.
      - name: Delete untagged images
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: nos-${{ matrix.machine }}
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0

      # Delete old images: every build leaves an image and a signature (.sig) version. The last
      # 30 versions (~15 days) are kept; you can go back to those days with
      # `bootc switch ghcr.io/<owner>/nos-<machine>:YYYYMMDD`. If deletion fails, the build is
      # not marked as failed.
      - name: Delete old images
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: nos-${{ matrix.machine }}
          package-type: container
          min-versions-to-keep: 30
