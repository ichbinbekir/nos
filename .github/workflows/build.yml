name: Build

on:
  push:
    branches:
      - master
    paths-ignore:
      # İmajın içeriğini değiştirmeyen dosyalar
      - '**.md'
      - 'docs/**'
      - 'dotfiles/**'
      - 'tools/**'
      - 'LICENSE'
      - 'cosign.pub'
      - '.gitignore'
      - '.gitattributes'
      # Kurulum ISO'su; onu build-iso.yml elle build eder.
      - 'iso/**'
      - '.github/workflows/build-iso.yml'
      # Sadece bootc imajını ilgilendiren dosyalar; onları build-bootc.yml build eder.
      # İki workflow birbirinden bağımsız: yeni bootc bir sonraki build'de (04:00 ya da elle) alınır.
      - 'build_files/bootc/build-bootc.sh'
      - 'build_files/bootc/Containerfile'
      - '.github/workflows/build-bootc.yml'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/**'
      - 'dotfiles/**'
      - 'iso/**'
  # Arch rolling release: paketler her gün güncelleniyor, imaj da her gün yeniden build edilir.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Önce ortak imaj (nos) build edilir; yayınlanmaz, sadece bu işin içinde kalır. Sonra her
  # makine imajı (nos-<makine>, machines/ altındaki her klasör) onun üzerine sırayla kurulur,
  # katmanlara bölünür, yüklenir ve imzalanır. Ortak imaj bir kez build edilir: makineler
  # ayrı işlerde paralel build edilseydi her biri ortak imajı ya yeniden build edecek ya da
  # bir yerden indirecekti.
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    env:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
    outputs:
      machines: ${{ steps.machines.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # Registry büyük harf kabul etmediği için kullanıcı adı küçük harfe çevrilir
      - name: Set registry
        run: |
          echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "BOOTC_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nos-bootc:latest" >> "$GITHUB_ENV"

      # machines/ altındaki her klasör bir makine imajı. Yeni makine için klasör eklemek yeter
      # (bir de system_files/etc/containers/policy.json'a imaj adı).
      - name: List machines
        id: machines
        run: |
          list=$(find machines -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "MACHINES=$(jq -r 'join(" ")' <<<"$list")" >> "$GITHUB_ENV"
          echo "Makineler: $list"

      # Build sırasında nos-bootc imajı çekildiği için giriş build'den önce yapılır.
      - name: Log in to registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          # cosign Docker'ın oturum bilgisini kullanıyor
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build base image
        run: just build

      # İmza, SIGNING_SECRET tanımlıysa atılır. Anahtar şifreliyse şifresi
      # COSIGN_PASSWORD secret'ında durur (bkz. README).
      - name: Install cosign
        if: github.event_name != 'pull_request' && env.SIGNING_SECRET != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      # Her makine için: build → katmanlara bölme → yükleme → imza. Bir makine hata verirse
      # diğerleri yine yüklenir, iş sonunda başarısız sayılır. Pull request'te sadece build
      # edilir (yükleme yok).
      #
      # Etiketler: latest (sistemlerin takip ettiği) ve YYYYMMDD (eski bir güne dönmek için).
      # podman, yeni parçaları ilk yüklediğinde katman bilgilerini eksik gönderiyor; ilk push
      # ile sonrakilerin kimliği (digest) farklı çıkıyor (podman#27796, bootcrew de aynısını
      # yapıyor). Bu yüzden önce latest iki kez yüklenir, sonra tarih etiketi; hepsi aynı
      # kimliği taşır ve imza o kimliğe atılır.
      - name: Build, push and sign machine images
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          PUBLISH: ${{ github.event_name != 'pull_request' }}
        run: |
          # Dıştaki kabuk hatada durmaz (bir makine düşünce diğerleri devam etsin); her makine
          # kendi alt kabuğunda hatada durur. (if koşulu içindeki alt kabukta set -e
          # çalışmadığı için sonuç ayrıca alınıyor.)
          set +e
          set -uo pipefail
          failed=()
          for machine in $MACHINES; do
            echo "::group::nos-$machine"
            (
              set -euxo pipefail
              image="nos-$machine"
              BASE_IMAGE=localhost/nos:latest just build-machine "$machine"
              if [[ $PUBLISH == true ]]; then
                just rechunk "$image"
                for tag in latest latest "$(date -u +%Y%m%d)"; do
                  podman push --digestfile=/tmp/digestfile "$image:latest" "$IMAGE_REGISTRY/$image:$tag"
                  echo "$tag -> $(< /tmp/digestfile)"
                done
                if [[ -n $SIGNING_SECRET ]]; then
                  cosign sign -y --new-bundle-format=false --use-signing-config=false \
                    --key env://COSIGN_PRIVATE_KEY "$IMAGE_REGISTRY/$image@$(< /tmp/digestfile)"
                fi
              fi
              # Sıradaki makineye yer açılsın.
              podman rmi -f "$image:latest"
            )
            rc=$?
            echo "::endgroup::"
            if ((rc != 0)); then
              echo "::error::nos-$machine başarısız"
              failed+=("$machine")
            fi
          done
          ((${#failed[@]} == 0)) || { echo "Başarısız: ${failed[*]}"; exit 1; }

  # Etiketsiz ve eski kayıtları silme, her makine imajı için ayrı (bir şey build etmez).
  # Makinelerden biri başarısız olsa da diğerlerininki temizlenir.
  cleanup:
    needs: build
    if: always() && github.event_name != 'pull_request' && needs.build.outputs.machines != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.build.outputs.machines) }}
    steps:
      # Etiketsiz kayıtları sil: latest'in ilk yüklemesi (podman#27796, yukarıda) ikinci
      # yüklemeyle etiketini kaybedip sahipsiz kalıyor; her build bir tane bırakıyordu.
      # İmzalar eski biçimde (.sig etiketi) olduğu ve imaj tek parça (index değil) olduğu
      # için hiçbir etiketsiz kayıt gerekli değil. Eski imajları silmeden önce çalışır ki
      # 30 kayıt sınırı sadece imaj ve imzaları saysın.
      - name: Delete untagged images
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: nos-${{ matrix.machine }}
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0

      # Eski imajları sil: her build bir imaj ve bir imza (.sig) kaydı bırakıyor. Son 30
      # kayıt (~15 gün) tutulur; o günlere `bootc switch ghcr.io/<sahip>/nos-<makine>:YYYYMMDD`
      # ile dönülebilir. Silme başarısız olursa build başarısız sayılmaz.
      - name: Delete old images
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: nos-${{ matrix.machine }}
          package-type: container
          min-versions-to-keep: 30
