# Pencereye göre tuş eşlemeleri (keyd-application-mapper). Tuş adları ABD klavyesindeki
# yerlere göre: Türkçe Q'da "." yazan tuş "slash".
#
# Sober (Roblox): hareket ESDF; yanındaki tuşlar da bir sağa kaydırılmış (W→q, E→w, R→e,
# T→r, Y→t, U→y, S→a, D→s, F→d, G→f). "." eşlemeyi açıp kapatır: nomap katmanı açıkken
# tuşlar normal yazar (/etc/keyd/default.conf).
[*sober*]
w = q
e = w
r = e
t = r
y = t
u = y
s = a
d = s
f = d
g = f
slash = toggle(nomap)
nomap.w = w
nomap.e = e
nomap.r = r
nomap.t = t
nomap.y = y
nomap.u = u
nomap.s = s
nomap.d = d
nomap.f = f
nomap.g = g
