# Per-window key mappings (keyd-application-mapper). Key names follow their positions on
# a US keyboard: the key that types "." on Turkish Q is "slash".
#
# Sober (Roblox): movement on ESDF; the neighbouring keys are shifted one to the right too (W→q, E→w, R→e,
# T→r, Y→t, U→y, S→a, D→s, F→d, G→f). "." toggles the mapping: while the nomap layer is on,
# keys type normally (/etc/keyd/default.conf).
[*sober*]
w = q
e = w
r = e
t = r
y = t
u = y
s = a
d = s
f = d
g = f
slash = toggle(nomap)
nomap.w = w
nomap.e = e
nomap.r = r
nomap.t = t
nomap.y = y
nomap.u = u
nomap.s = s
nomap.d = d
nomap.f = f
nomap.g = g

# In every window: Caps Lock becomes F19 (Discord push-to-talk; caps lock never turns on)
[*]
capslock = f19
